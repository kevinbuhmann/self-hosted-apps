services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HOST_IP_ADDRESS}:80:80"
      - "${HOST_IP_ADDRESS}:443:443"
    networks:
      internet:
      reverse-proxy:
        aliases:
          - cloud.${BASE_DOMAIN}
          - paperless.${BASE_DOMAIN}
          - mindwtr.${BASE_DOMAIN}
          - mindwtr-cloud.${BASE_DOMAIN}
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      HOST_IP_ADDRESS: ${HOST_IP_ADDRESS:-0.0.0.0}

  ################################################################################
  ################################# Backup Hooks #################################
  ################################################################################

  pre-backup:
    image: alpine:latest
    profiles: ["backup"]
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --create --verbose --file /data-backup/caddy-data.tar --exclude locks --directory /data .

  post-restore:
    image: alpine:latest
    profiles: ["restore"]
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --extract --verbose --file /data-backup/caddy-data.tar --directory /data

networks:
  internet:
  reverse-proxy:
    external: true
    name: apps-reverse-proxy
