services:
  caddy:
    build:
      context: .
      args:
        CLOUDFLARE_API_URL: ${CLOUDFLARE_API_URL}
    restart: unless-stopped
    ports:
      - "${HOST_IP_ADDRESS}:80:80"
      - "${HOST_IP_ADDRESS}:443:443"
    networks:
      internet:
      reverse-proxy:
        aliases:
          - cloud.${BASE_DOMAIN}
          - paperless.${BASE_DOMAIN}
          - mindwtr.${BASE_DOMAIN}
          - mindwtr-cloud.${BASE_DOMAIN}
          - obsidian-livesync-couchdb.${BASE_DOMAIN}
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      HOST_IP_ADDRESS: ${HOST_IP_ADDRESS:-0.0.0.0}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

  ################################################################################
  ################################# Backup Hooks #################################
  ################################################################################

  caddy-pre-backup:
    image: alpine:3
    profiles: ["pre-backup"]
    network_mode: none
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --create --verbose --file /data-backup/caddy-data.tar --exclude locks --directory /data .

  caddy-post-restore:
    image: alpine:3
    profiles: ["post-restore"]
    network_mode: none
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --extract --verbose --file /data-backup/caddy-data.tar --directory /data

networks:
  internet:
