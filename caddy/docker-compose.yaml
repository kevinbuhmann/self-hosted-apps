services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - reverse-proxy
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - GRIST_EMAIL_ADDRESS=${GRIST_EMAIL_ADDRESS}
      - GRIST_PASSWORD_HASH=${GRIST_PASSWORD_HASH}

networks:
  reverse-proxy:
    external: true
