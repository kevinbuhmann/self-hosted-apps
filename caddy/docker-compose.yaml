services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HOST_IP_ADDRESS}:80:80"
      - "${HOST_IP_ADDRESS}:443:443"
    networks:
      internet:
      reverse-proxy:
        aliases:
          - cloud.home.arpa
          - paperless.home.arpa
          - mindwtr.home.arpa
          - mindwtr-cloud.home.arpa
          - obsidian-livesync-couchdb.home.arpa
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      HOST_IP_ADDRESS: ${HOST_IP_ADDRESS:-0.0.0.0}

  ################################################################################
  ################################# Backup Hooks #################################
  ################################################################################

  pre-backup:
    image: alpine:3
    profiles: ["backup"]
    network_mode: none
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --create --verbose --file /data-backup/caddy-data.tar --exclude locks --directory /data .

  post-restore:
    image: alpine:3
    profiles: ["restore"]
    network_mode: none
    volumes:
      - /srv/apps/caddy/data:/data
      - /srv/apps/caddy/data-backup:/data-backup
    command: tar --extract --verbose --file /data-backup/caddy-data.tar --directory /data

networks:
  internet:
  reverse-proxy:
    external: true
    name: apps-reverse-proxy
