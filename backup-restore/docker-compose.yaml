services:
  restic-backup:
    build: .
    profiles: ["backup"]
    volumes:
      # mount source directories as read only
      - /opt/apps:/opt/apps:ro
      - /srv/apps:/srv/apps:ro
      # mount restic repository and related files
      - ${RESTIC_REPO}:/restic-repo
      - ${RESTIC_PASSWORD_FILE}:/restic-password.txt:ro
      - ./restic-exclude.txt:/restic-exclude.txt:ro
      # mount script
      - ./scripts/run-restic.sh:/scripts/run-restic.sh:ro
    environment:
      RESTIC_HOST: ${RESTIC_HOST}
    user: "${HOST_UID}:${HOST_GID}"
    command: sh /scripts/run-restic.sh backup

  restic-restore:
    build: .
    profiles: ["restore"]
    volumes:
      # mount destination directories
      - /opt/apps:/opt/apps
      - /srv/apps:/srv/apps
      # mount restic repository and related files
      - ${RESTIC_REPO}:/restic-repo
      - ${RESTIC_PASSWORD_FILE}:/restic-password.txt:ro
      # mount script
      - ./scripts/run-restic.sh:/scripts/run-restic.sh:ro
    environment:
      RESTIC_HOST: ${RESTIC_HOST}
    user: "${HOST_UID}:${HOST_GID}"
    command: sh /scripts/run-restic.sh restore

  rclone-backup:
    build: .
    profiles: ["backup"]
    volumes:
      # mount restic repository as read only
      - ${RESTIC_REPO}:/restic-repo:ro
      # mount rclone config (need write access to save updated access tokens)
      - ${RCLONE_CONFIG_FILE}:/rclone.conf
      # mount script
      - ./scripts/run-rclone.sh:/scripts/run-rclone.sh:ro
    environment:
      RCLONE_TARGET: ${RCLONE_TARGET}
    user: "${HOST_UID}:${HOST_GID}"
    command: sh /scripts/run-rclone.sh backup

  rclone-restore:
    build: .
    profiles: ["restore"]
    volumes:
      # mount destination restic repository
      - ${RESTIC_REPO}:/restic-repo
      # mount rclone config (need write access to save updated access tokens)
      - ${RCLONE_CONFIG_FILE}:/rclone.conf
      # mount script
      - ./scripts/run-rclone.sh:/scripts/run-rclone.sh:ro
    environment:
      HOST_UID: ${HOST_UID}
      HOST_GID: ${HOST_GID}
      RCLONE_TARGET: ${RCLONE_TARGET}
    user: "0:0" # run as root to be able to create the restic repo directory, script will change ownership of restored files to host user
    command: sh /scripts/run-rclone.sh restore
