services:
  opencloud:
    image: opencloudeu/opencloud-rolling:9
    restart: unless-stopped
    depends_on:
      opencloud-init:
        condition: service_completed_successfully
    user: 1000:1000
    networks:
      - reverse-proxy
    volumes:
      - /srv/apps/opencloud/opencloud_config:/etc/opencloud
      - /srv/apps/opencloud/opencloud_data:/var/lib/opencloud
    environment:
      OC_URL: https://cloud.${BASE_DOMAIN}
      OC_INSECURE: true # self-signed certificate
      PROXY_TLS: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 30s
      start_interval: 1s

  opencloud-init:
    image: opencloudeu/opencloud-rolling:9
    user: "0:0" # run as root to fix host permissions
    network_mode: none
    volumes:
      - /srv/apps/opencloud/opencloud_config:/etc/opencloud
      - /srv/apps/opencloud/opencloud_data:/var/lib/opencloud
      - ./scripts/opencloud-init.sh:/scripts/opencloud-init.sh:ro
    environment:
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/opencloud-init.sh"]
