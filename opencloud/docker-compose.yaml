services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    restart: unless-stopped
    user: 1000:1000
    networks:
      - internal
      - reverse-proxy
    volumes:
      - /srv/apps/opencloud/opencloud_config:/etc/opencloud
      - /srv/apps/opencloud/opencloud_data:/var/lib/opencloud
    environment:
      OC_URL: https://cloud.home.arpa
      OC_INSECURE: true # self-signed certificate
      PROXY_TLS: false

  opencloud-init:
    image: opencloudeu/opencloud-rolling:latest
    user: "0:0" # run as root to fix host permissions
    network_mode: none
    volumes:
      - /srv/apps/opencloud/opencloud_config:/etc/opencloud
      - /srv/apps/opencloud/opencloud_data:/var/lib/opencloud
      - ./init-opencloud.sh:/init-opencloud.sh:ro
    environment:
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "/init-opencloud.sh"]

networks:
  internal:
    internal: true
  reverse-proxy:
    external: true
    name: apps-reverse-proxy
