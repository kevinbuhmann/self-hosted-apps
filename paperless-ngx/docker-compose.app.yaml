services:
  paperless-valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    networks:
      - paperless-internal
    volumes:
      - /srv/apps/paperless-ngx/valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 30s
      start_interval: 1s

  paperless-postgres:
    image: postgres:18
    restart: unless-stopped
    networks:
      - paperless-internal
    volumes:
      - /srv/apps/paperless-ngx/postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=localhost --port=5432"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 30s
      start_interval: 1s

  paperless:
    image: paperlessngx/paperless-ngx:3.3
    restart: unless-stopped
    depends_on:
      paperless-valkey:
        condition: service_healthy
      paperless-postgres:
        condition: service_healthy
    networks:
      - reverse-proxy
      - paperless-internal
    volumes:
      - /srv/apps/paperless-ngx/paperless_data:/usr/src/paperless/data
      - /srv/apps/paperless-ngx/paperless_media:/usr/src/paperless/media
      - /srv/apps/paperless-ngx/paperless_export:/usr/src/paperless/export
      - /srv/apps/paperless-ngx/paperless_consume:/usr/src/paperless/consume
    environment:
      # broker
      PAPERLESS_REDIS: redis://paperless-valkey:6379
      # database
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-postgres
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASSWORD: ${POSTGRES_PASSWORD}
      # hosts
      PAPERLESS_URL: https://paperless.${BASE_DOMAIN}
      PAPERLESS_USE_X_FORWARDED_PROTO: true
      # sign in / session security
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # date time settings
      PAPERLESS_TIME_ZONE: America/Chicago
      PAPERLESS_DATE_ORDER: MDY
      # OCR settings
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_CLEAN: clean-final
      # consumer settings
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true

  ################################################################################
  ################################# Backup Hooks #################################
  ################################################################################

  paperless-pre-backup:
    image: postgres:18
    profiles: ["pre-backup"]
    depends_on:
      paperless-postgres:
        condition: service_healthy
    networks:
      - paperless-internal
    volumes:
      - /srv/apps/paperless-ngx/postgres_backup:/target
    environment:
      PGHOST: paperless-postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: pg_dump --format=tar --file=/target/paperless_db.tar

  paperless-post-restore:
    image: postgres:18
    profiles: ["post-restore"]
    depends_on:
      paperless-postgres:
        condition: service_healthy
    networks:
      - paperless-internal
    volumes:
      - /srv/apps/paperless-ngx/postgres_backup:/target
    environment:
      PGHOST: paperless-postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: pg_restore --clean --if-exists --exit-on-error --dbname=${POSTGRES_DB} --format=tar /target/paperless_db.tar

networks:
  paperless-internal:
    internal: true
